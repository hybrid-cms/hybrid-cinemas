name: Build HYBRID CINEMAS APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK for users
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/HYBRID-CINEMAS.apk
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.1
          name: HYBRID CINEMAS Android v1.0.1
          make_latest: true
          files: android/app/build/outputs/apk/debug/HYBRID-CINEMAS.apk
          fail_on_unmatched_files: true
