name: Build HYBRID CINEMAS APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare the original HYBRID CINEMAS logo as launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("file_000000001de482118f97ed13eb144a86.png")
          if not source.exists():
              raise SystemExit("Original HYBRID CINEMAS logo image is missing from the repository")
          logo = Image.open(source).convert("RGBA")
          # Keep the complete supplied logo visible inside Android's launcher mask.
          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          logo.thumbnail((278, 278), Image.Resampling.LANCZOS)
          foreground.alpha_composite(logo, ((432-logo.width)//2, (432-logo.height)//2))
          out = Path("android/app/src/main/res")
          (out / "drawable-nodpi").mkdir(parents=True, exist_ok=True)
          foreground.save(out / "drawable-nodpi/hybrid_logo_foreground.png", optimize=True)
          for density, size in {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}.items():
              folder = out / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              icon = Image.new("RGBA", (size,size), (5,3,5,255))
              thumb = Image.open(source).convert("RGBA")
              thumb.thumbnail((size,size), Image.Resampling.LANCZOS)
              icon.alpha_composite(thumb, ((size-thumb.width)//2, (size-thumb.height)//2))
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
          PY
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK for users
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/HYBRID-CINEMAS.apk
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.2
          name: HYBRID CINEMAS Android v1.0.2
          make_latest: true
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/HYBRID-CINEMAS.apk
          fail_on_unmatched_files: true
